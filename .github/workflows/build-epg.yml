name: build-epg

on:
  schedule:
    # 03:00 ve 15:00 (TR saati). GitHub cron UTC çalışır.
    - cron: "0 0,12 * * *"
  # Elle çalıştırırken kapsamı daraltabilirsin: tek site + 1 gün ile hızlı deneme.
  workflow_dispatch:
    inputs:
      sites:
        description: "Kaynak siteler (virgülle)"
        default: "dsmart.com.tr"
      days:
        description: "Kaç günlük akış"
        default: "7"
      publish:
        description: "Pages'e yayınla"
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

# Aynı anda tek yayın; gecikmiş bir çalışma yenisini ezmesin.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Kaynak site seçimi (07.08.2026'da dördü de hem TR IP'den hem GitHub
      # runner'dan tek tek denendi):
      #   dsmart.com.tr       -> runner'dan ÇALIŞIYOR (tek gün: 57 kanal/1824 program)
      #   digiturk.com.tr     -> TR IP'den mükemmel, runner'dan 112 kanalın hepsine 403
      #   tvplus.com.tr       -> TR IP'den çalışıyor, runner'dan "undefined headers"
      #   turksatkablo.com.tr -> sertifika zinciri bozuk, her yerden başarısız
      # Yani GitHub'ın ABD IP'sinden erişilebilen tek kaynak dsmart.
      # digiturk/tvplus eklemek istersen TR IP'li bir makinede çalıştırman gerekir.
      - name: iptv-org/epg ile XMLTV üret
        env:
          SITES: ${{ inputs.sites || 'dsmart.com.tr' }}
          DAYS: ${{ inputs.days || '7' }}
        run: |
          git clone --depth 1 https://github.com/iptv-org/epg.git .epg
          cd .epg
          npm ci
          npm run grab --- \
            --sites="$SITES" \
            --lang=tr \
            --days="$DAYS" \
            --timeout=20000 \
            --maxConnections=5 \
            --output=../guide.xml

      - name: JSON'a dönüştür
        run: |
          npm install
          node convert.mjs guide.xml build/dsmart.json

      # digiturk ABD IP'sine 403 verdiği için burada çekilemiyor; ATV dahil o
      # kanallar Ertan'ın Mac'inde (TR IP) üretilip data/digiturk.json olarak
      # işleniyor (bkz. local/run.sh). Dosya yoksa ya da eskiyse yayın yine
      # dsmart'la devam eder.
      - name: Yerel digiturk verisiyle birleştir
        run: node merge.mjs public/turkey.json build/dsmart.json data/digiturk.json

      - name: Çıktıyı doğrula
        run: node check.mjs public/turkey.json

      - name: Ham XMLTV'yi hata ayıklama için sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guide-xml
          path: guide.xml
          retention-days: 7
          if-no-files-found: ignore

      # Zamanlanmış çalışmada `inputs.publish` null'dır ve GitHub ifadelerinde
      # null == false sayıldığı için `inputs.publish != false` yayını ATLIYORDU.
      # Bu yüzden Pages 07.08.2026'daki elle tetiklenen çalışmada donup kaldı.
      # Doğrusu: schedule'da her zaman yayınla, yalnızca elle tetiklerken kutuya bak.
      - uses: actions/upload-pages-artifact@v3
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        with:
          path: public

  deploy:
    needs: build
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
